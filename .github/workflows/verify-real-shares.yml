name: Verify real ChatGPT shares
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse real shares
        run: |
          node --input-type=module <<'JS'
          import { loadShare } from './src/share2.js';
          const cases = {
            normal: 'https://chatgpt.com/share/6a9db7fc-2814-83ed-b069-e4ba5dc0ba05',
            image: 'https://chatgpt.com/share/6a9dbdb3-7598-83eb-b811-9b9341404c6e',
            documents: 'https://chatgpt.com/share/6a9dc48f-9250-83eb-83ae-4b012ef7b1be'
          };
          for (const [name,url] of Object.entries(cases)) {
            const c = await loadShare(url);
            const sums = c.turns.reduce((a,t)=>({
              turns:a.turns+1,
              tools:a.tools+t.toolCalls,
              web:a.web+t.web,
              code:a.code+t.code,
              images:a.images+t.generatedImages,
              videos:a.videos+t.generatedVideos,
              documents:a.documents+t.generatedDocuments
            }),{turns:0,tools:0,web:0,code:0,images:0,videos:0,documents:0});
            console.log(name, JSON.stringify(sums));
          }
          JS
