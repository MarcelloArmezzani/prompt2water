name: Debug ChatGPT share structure
on:
  push:
    paths:
      - '.github/workflows/debug-chatgpt-share.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect share structure through Jina
        shell: bash
        run: |
          python - <<'PY'
          import requests, json, re
          target='https://chatgpt.com/backend-api/share/6a9dbdb3-7598-83eb-b811-9b9341404c6e'
          url='https://r.jina.ai/'+target
          r=requests.get(url, timeout=60, headers={'User-Agent':'Mozilla/5.0','Accept':'text/plain'})
          print('status', r.status_code, r.headers.get('content-type'))
          r.raise_for_status()
          raw=r.text.strip()
          print('prefix', repr(raw[:120]))
          candidates=[raw]
          m=re.search(r'```(?:json)?\s*([\s\S]*?)```', raw, re.I)
          if m: candidates.append(m.group(1).strip())
          a,b=raw.find('{'),raw.rfind('}')
          if a>=0 and b>a: candidates.append(raw[a:b+1])
          data=None
          for c in candidates:
              try:
                  data=json.loads(c); break
              except Exception: pass
          if data is None:
              print('NO_JSON')
              print(raw[:3000])
              raise SystemExit(2)
          nodes=data.get('linear_conversation') or list((data.get('mapping') or {}).values())
          print('title', data.get('title'))
          print('nodes', len(nodes))
          for i,node in enumerate(nodes):
              m=(node or {}).get('message') or {}
              if not m: continue
              a=m.get('author') or {}
              c=m.get('content') or {}
              md=m.get('metadata') or {}
              parts=c.get('parts') if isinstance(c.get('parts'),list) else []
              ptypes=[]
              for p in parts:
                  if isinstance(p,dict): ptypes.append(p.get('content_type') or p.get('type') or '<dict>')
                  elif isinstance(p,str): ptypes.append('<text>')
                  else: ptypes.append(type(p).__name__)
              relevant={k:md.get(k) for k in md if any(x in k.lower() for x in ['image','tool','model','asset','attachment','recipient','finish'])}
              print(json.dumps({
                  'i':i,'role':a.get('role'),'author_name':a.get('name'),'recipient':m.get('recipient'),
                  'content_type':c.get('content_type'),'part_types':ptypes,'metadata_relevant':relevant,
                  'metadata_keys':sorted(md.keys())
              }, ensure_ascii=False, default=str))
          PY
