name: Test shared-chat parser
on:
  push:
    paths:
      - '.github/workflows/test-share-parser.yml'
      - 'src/share2.js'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deployed parser on real shares
        shell: bash
        run: |
          node --experimental-default-type=module - <<'NODE'
          import { parseSharedLink } from './src/share2.js';
          const tests = [
            ['earlier', 'https://chatgpt.com/share/6a9db7fc-2814-83ed-b069-e4ba5dc0ba05'],
            ['kyoto-image', 'https://chatgpt.com/share/6a9dbdb3-7598-83eb-b811-9b9341404c6e']
          ];
          for (const [name,url] of tests) {
            const convs = await parseSharedLink(url);
            const c = convs[0];
            const totals = {web:0,code:0,image_in:0,image_out:0,video:0,document:0};
            for (const m of c.messages) for (const k of Object.keys(totals)) totals[k] += m.tools?.[k] || 0;
            console.log(JSON.stringify({name, source:c.source_format, messages:c.messages.length, totals}));
          }
          NODE
