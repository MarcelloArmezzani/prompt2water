name: Probe ChatGPT share proxies
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate direct React Flight parser
        shell: bash
        run: |
          set -e
          mkdir /tmp/parser && cd /tmp/parser
          npm init -y >/dev/null
          npm install chatgpt-share-parser@latest >/dev/null
          node --input-type=module <<'JS'
          import { fetchChatGptShare } from 'chatgpt-share-parser';
          const cases = {
            normal:'https://chatgpt.com/share/6a9db7fc-2814-83ed-b069-e4ba5dc0ba05',
            image:'https://chatgpt.com/share/6a9dbdb3-7598-83eb-b811-9b9341404c6e',
            failing:'https://chatgpt.com/share/6a9de238-6314-83eb-92a0-330979e85d55'
          };
          for (const [name,url] of Object.entries(cases)) {
            const t0=Date.now(); const c=await fetchChatGptShare(url); const dt=(Date.now()-t0)/1000;
            const roles={}, authors={}, assets={image:0,file:0};
            for(const r of c.replies){roles[r.type]=(roles[r.type]||0)+1;authors[r.authorName]=(authors[r.authorName]||0)+1;for(const a of r.assets||[])assets[a.assetType]=(assets[a.assetType]||0)+1;}
            console.log(name,JSON.stringify({seconds:dt,title:c.title,model:c.aiModel,replies:c.replies.length,roles,assets,topAuthors:Object.entries(authors).sort((a,b)=>b[1]-a[1]).slice(0,15)}));
          }
          JS
