name: Probe ChatGPT share proxies
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check ChatGPT share page CORS
        shell: bash
        run: |
          set -e
          SHARE='https://chatgpt.com/share/6a9de238-6314-83eb-92a0-330979e85d55'
          curl -sS -L --max-time 15 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -H 'Origin: https://marcelloarmezzani.github.io' \
            -D /tmp/headers -o /tmp/share.html -w 'CODE=%{http_code} TIME=%{time_total} SIZE=%{size_download}\n' "$SHARE"
          grep -iE '^(access-control|cache-control|content-type|vary|cross-origin|content-security)' /tmp/headers || true
          echo "flight=$(grep -c 'streamController.enqueue' /tmp/share.html || true)"
