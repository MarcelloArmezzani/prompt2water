name: Probe ChatGPT share proxies
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Benchmark normal share relays
        shell: bash
        run: |
          set +e
          SHARE='https://chatgpt.com/share/6a9de238-6314-83eb-92a0-330979e85d55'
          ENC=$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$SHARE")
          probe(){
            NAME="$1"; URL="$2"
            OUT=$(mktemp)
            META=$(curl --compressed -L --max-time 20 -sS -o "$OUT" -w 'code=%{http_code} ttfb=%{time_starttransfer} time=%{time_total} size=%{size_download}' "$URL" 2>&1)
            printf '%s %s flight=' "$NAME" "$META"
            grep -q 'streamController.enqueue' "$OUT" && printf yes || printf no
            printf ' title='; grep -o '<title>[^<]*' "$OUT" | head -1 | sed 's/<title>//'
            rm -f "$OUT"
          }
          probe direct "$SHARE"
          probe allorigins "https://api.allorigins.win/raw?url=$ENC"
          probe codetabs "https://api.codetabs.com/v1/proxy?quest=$ENC"
          probe corslol "https://api.cors.lol/?url=$ENC"
          probe corsproxyio "https://corsproxy.io/?url=$ENC"
          probe isomorphic "https://cors.isomorphic-git.org/$SHARE"
