name: Probe ChatGPT share proxies
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test fresh Jina share rendering
        shell: bash
        run: |
          set +e
          SHARE='https://chatgpt.com/share/6a9de238-6314-83eb-92a0-330979e85d55'
          for MODE in cached fresh zero; do
            OUT=$(mktemp)
            if [ "$MODE" = fresh ]; then
              META=$(curl -L --max-time 15 -sS -H 'X-No-Cache: true' -o "$OUT" -w 'code=%{http_code} time=%{time_total} size=%{size_download}' "https://r.jina.ai/$SHARE" 2>&1)
            elif [ "$MODE" = zero ]; then
              META=$(curl -L --max-time 15 -sS -H 'X-Cache-Tolerance: 0' -o "$OUT" -w 'code=%{http_code} time=%{time_total} size=%{size_download}' "https://r.jina.ai/$SHARE" 2>&1)
            else
              META=$(curl -L --max-time 15 -sS -o "$OUT" -w 'code=%{http_code} time=%{time_total} size=%{size_download}' "https://r.jina.ai/$SHARE" 2>&1)
            fi
            echo "--- $MODE $META ---"
            grep -E -m 8 'You said|ChatGPT said|####|Markdown Content|Warning:|Title:' "$OUT" || true
            echo '--- prefix ---'
            head -c 1200 "$OUT" | tr '\n' ' '
            echo
            rm -f "$OUT"
          done
