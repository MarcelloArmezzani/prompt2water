name: Probe ChatGPT share proxies
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify browser CORS and cached raw share speed
        shell: bash
        run: |
          set -e
          URL='https://r.jina.ai/https://chatgpt.com/share/6a9de238-6314-83eb-92a0-330979e85d55'
          echo '--- preflight ---'
          curl -sS -X OPTIONS -D - -o /dev/null \
            -H 'Origin: https://marcelloarmezzani.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: x-respond-with,x-engine,x-cache-tolerance,accept' \
            "$URL" | grep -iE '^(HTTP|access-control|vary)' || true
          echo '--- request 1 ---'
          curl -sS -o /dev/null --max-time 15 \
            -H 'Origin: https://marcelloarmezzani.github.io' \
            -H 'X-Respond-With: html' -H 'X-Engine: curl' -H 'X-Cache-Tolerance: 3600' \
            -w 'code=%{http_code} time=%{time_total} size=%{size_download}\n' "$URL"
          echo '--- request 2 ---'
          curl -sS -o /dev/null --max-time 15 \
            -H 'Origin: https://marcelloarmezzani.github.io' \
            -H 'X-Respond-With: html' -H 'X-Engine: curl' -H 'X-Cache-Tolerance: 3600' \
            -w 'code=%{http_code} time=%{time_total} size=%{size_download}\n' "$URL"
