name: Probe ChatGPT share proxies
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact failing share
        shell: bash
        run: |
          set +e
          ID='6a9de238-6314-83eb-92a0-330979e85d55'
          API="https://chatgpt.com/backend-api/share/$ID"
          SHARE="https://chatgpt.com/share/$ID"
          echo '--- direct share, browser UA ---'
          curl -L --max-time 10 -sS -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' -w '\nCODE=%{http_code} TIME=%{time_total} SIZE=%{size_download}\n' "$SHARE" | head -c 3000
          echo
          echo '--- direct API, browser UA + referer ---'
          curl -L --max-time 10 -sS -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' -H "Referer: $SHARE" -w '\nCODE=%{http_code} TIME=%{time_total} SIZE=%{size_download}\n' "$API" | head -c 3000
          echo
          echo '--- Jina normal share ---'
          curl -L --max-time 10 -sS -w '\nCODE=%{http_code} TIME=%{time_total} SIZE=%{size_download}\n' "https://r.jina.ai/$SHARE" | head -c 5000
