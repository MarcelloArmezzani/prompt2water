name: Probe ChatGPT share proxies
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Benchmark one-fetch share parser
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/p2w-probe && cd /tmp/p2w-probe
          npm init -y >/dev/null 2>&1
          npm install chatgpt-share-parser >/dev/null 2>&1
          node --input-type=module <<'JS'
          import { fetchChatGptShare } from 'chatgpt-share-parser';
          const url = 'https://chatgpt.com/share/6a9de238-6314-83eb-92a0-330979e85d55';
          const t0 = performance.now();
          const chat = await fetchChatGptShare(url);
          const elapsed = (performance.now()-t0)/1000;
          const roles = chat.replies.reduce((a,r)=>(a[r.type]=(a[r.type]||0)+1,a),{});
          const assets = chat.replies.reduce((a,r)=>a+r.assets.length,0);
          console.log(JSON.stringify({elapsed,title:chat.title,model:chat.aiModel,replies:chat.replies.length,roles,assets}));
          JS
