name: Probe ChatGPT share proxies
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate exact production modules
        shell: bash
        run: |
          set -e
          node --input-type=module <<'JS'
          import { loadShare } from './src/share2.js';
          import { estimateConversation } from './src/core.js';
          const exact='https://chatgpt.com/share/6a9de238-6314-83eb-92a0-330979e85d55';
          const image='https://chatgpt.com/share/6a9dbdb3-7598-83eb-b811-9b9341404c6e';
          let t=Date.now(); const c=await loadShare(exact); const first=(Date.now()-t)/1000;
          t=Date.now(); const result=estimateConversation(c,'GPT-5.6 Sol','Standard / none'); const compute=(Date.now()-t)/1000;
          t=Date.now(); const cached=await loadShare(exact); const second=(Date.now()-t)/1000;
          const sum=c.turns.reduce((a,x)=>({tools:a.tools+x.toolCalls,web:a.web+x.web,code:a.code+x.code,images:a.images+x.generatedImages,videos:a.videos+x.generatedVideos,docs:a.docs+x.generatedDocuments}),{tools:0,web:0,code:0,images:0,videos:0,docs:0});
          console.log('exact',JSON.stringify({firstSeconds:first,computeSeconds:compute,cachedSeconds:second,title:c.title,turns:c.turns.length,...sum,effectiveTokens:result.effectiveTokens}));
          t=Date.now(); const ci=await loadShare(image); const imageSeconds=(Date.now()-t)/1000;
          const generatedImages=ci.turns.reduce((n,x)=>n+x.generatedImages,0);
          console.log('image',JSON.stringify({seconds:imageSeconds,turns:ci.turns.length,generatedImages}));
          if(c.turns.length!==48)throw new Error(`Expected 48 turns, got ${c.turns.length}`);
          if(generatedImages!==1)throw new Error(`Expected 1 generated image, got ${generatedImages}`);
          if(second>0.1)throw new Error(`Memory cache too slow: ${second}s`);
          JS
