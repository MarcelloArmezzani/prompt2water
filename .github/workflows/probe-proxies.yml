name: Probe ChatGPT share proxies
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Benchmark structured share reader
        shell: bash
        run: |
          set -e
          URL='https://chatgpt.com/share/6a9de238-6314-83eb-92a0-330979e85d55'
          BODY=$(python - <<'PY'
          import json
          print(json.dumps({"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"read_shared_chat","arguments":{"url":"https://chatgpt.com/share/6a9de238-6314-83eb-92a0-330979e85d55","format":"json","include_reasoning":False,"include_tool_output":True}}}))
          PY
          )
          OUT=$(mktemp)
          curl -sS -L --max-time 20 \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -o "$OUT" -w 'CODE=%{http_code} TIME=%{time_total} SIZE=%{size_download}\n' \
            -d "$BODY" https://chat-share-reader.vercel.app/mcp
          python - "$OUT" <<'PY'
          import json,sys
          raw=open(sys.argv[1]).read()
          print('prefix',raw[:200].replace('\n',' '))
          obj=json.loads(raw)
          text=obj.get('result',{}).get('content',[{}])[0].get('text','')
          print('payload_chars',len(text))
          try:
              chat=json.loads(text)
              print('title',chat.get('title'))
              print('messageCount',chat.get('messageCount'))
              roles={}
              attachments=0
              for m in chat.get('messages',[]):
                  roles[m.get('role')]=roles.get(m.get('role'),0)+1
                  attachments+=len(m.get('attachments',[]) or [])
              print('roles',roles,'attachments',attachments,'model',chat.get('model'))
          except Exception as e: print('parse_error',e)
          PY
          rm "$OUT"
