name: Probe ChatGPT data route
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Benchmark React Router data URLs
        shell: bash
        run: |
          set +e
          ID='6a9de238-6314-83eb-92a0-330979e85d55'
          BASE="https://chatgpt.com/share/$ID"
          ROUTE='routes/share.$shareId.($action)'
          ENC=$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$ROUTE")
          probe(){
            NAME="$1"; URL="$2"
            OUT=$(mktemp); HDR=$(mktemp)
            META=$(curl --compressed -L --max-time 15 -sS -D "$HDR" -o "$OUT" -w 'code=%{http_code} ttfb=%{time_starttransfer} time=%{time_total} size=%{size_download}' "$URL" 2>&1)
            echo "$NAME $META type=$(grep -i '^content-type:' "$HDR" | tail -1 | tr -d '\r')"
            echo "prefix=$(head -c 180 "$OUT" | tr '\n' ' ')"
            grep -q 'linear_conversation' "$OUT" && echo 'linear=yes' || echo 'linear=no'
            rm -f "$OUT" "$HDR"
          }
          probe full "$BASE"
          probe data "$BASE.data"
          probe routed "$BASE.data?_routes=$ENC"
