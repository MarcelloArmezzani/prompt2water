name: Probe ChatGPT share proxies
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GPT Export inline code
        shell: bash
        run: |
          set -e
          curl -sSL 'https://gptexport.vercel.app/' -o /tmp/page.html
          python - <<'PY'
          import re
          s=open('/tmp/page.html',errors='ignore').read()
          for needle in ['fetch(', '/api/', 'export', 'shareUrl', 'share_url', 'format']:
              print('\n###',needle)
              for m in list(re.finditer(re.escape(needle),s,re.I))[:30]:
                  a=max(0,m.start()-500); b=min(len(s),m.start()+1500)
                  print(s[a:b].replace('\n',' ')[:2000])
          PY
