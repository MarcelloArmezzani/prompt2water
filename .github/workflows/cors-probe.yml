name: Probe ChatGPT share CORS
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect CORS headers
        shell: bash
        run: |
          set +e
          ID='6a9de238-6314-83eb-92a0-330979e85d55'
          ORIGIN='https://marcelloarmezzani.github.io'
          ROUTE='routes/share.$shareId.($action)'
          ENC=$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$ROUTE")
          for URL in \
            "https://chatgpt.com/share/$ID" \
            "https://chatgpt.com/share/$ID.data" \
            "https://chatgpt.com/share/$ID.data?_routes=$ENC" \
            "https://chatgpt.com/backend-api/share/$ID"; do
            echo "--- $URL"
            curl --compressed -sS -L --max-time 15 -D - -o /dev/null \
              -H "Origin: $ORIGIN" \
              -H 'Sec-Fetch-Mode: cors' \
              "$URL" | grep -Ei '^(HTTP/|access-control-|vary:|content-type:|content-length:|server:|cf-ray:)' || true
          done
