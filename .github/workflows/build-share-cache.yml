name: Build share cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Normalize shared conversation
        shell: bash
        run: |
          mkdir -p cache
          node --input-type=module <<'JS'
          import { fetchChatGptShareHtml, extractLoaderPayload, decodeLoader } from 'chatgpt-share-parser';
          import { parseChatGptShare } from './src/share2.js';
          import fs from 'node:fs';
          const id='6a9de238-6314-83eb-92a0-330979e85d55';
          const html=await fetchChatGptShareHtml(`https://chatgpt.com/share/${id}`);
          const loader=extractLoaderPayload(html);
          if(!loader) throw new Error('loader not found');
          const decoded=decodeLoader(loader);
          const data=decoded?.loaderData?.['routes/share.$shareId.($action)']?.serverResponse?.data;
          if(!data) throw new Error('conversation not found');
          const conversation=parseChatGptShare(data);
          fs.writeFileSync(`cache/${id}.json`,JSON.stringify({id,title:conversation.title,turns:conversation.turns}));
          console.log(`cached ${conversation.turns.length} turns`);
          JS
      - name: Commit cache
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cache/
          git diff --cached --quiet && exit 0
          git commit -m 'Cache verified ChatGPT share'
          git push
